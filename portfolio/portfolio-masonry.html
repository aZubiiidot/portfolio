  <!-- shared head resources -->
  <script>
    fetch('../head.html')
      .then(r => r.text())
      .then(html => {
        // Ez a regex már figyeli a href= és az src= kezdeteket is!
        let fixedHtml = html.replace(/(href|src)="(css|js|images|fonts)\//g, '$1="../$2/');
        document.head.insertAdjacentHTML('beforeend', fixedHtml);
      });
  </script>

</head>
