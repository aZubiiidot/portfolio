<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="../style.css">
	<script>
    	fetch('../head.html').then(function(r){ return r.text(); }).then(function(html){ document.head.insertAdjacentHTML('beforeend', html); });
	</script>
	<title>JP Istvan - Blogfolio</title>
</head>

<body data-bs-theme="dark">
	<link rel="stylesheet" type="text/css" href="../style.css">

	<div id="nav-placeholder"></div>
	<div id="sidebar-placeholder"></div>

	<main class="col-lg-9 offset-lg-3">
		<div class="container">
			<!-- ID hozzáadva a szélesség korlátozásához -->
			<div id="blog-content-wrapper" class="justify-content-center p-1 m-1 p-md-5 m-md-5">

				<!-- Fejléc átrendezve: leírás a cím alá került -->
				<div class="row mb-5">
					<div class="col-lg-12 mt-5 pt-5" data-aos="fade-up">
						<div class="section-header">
							<span class="introduction mb-3 d-block">Recent Posts</span>
							<h1 class="name mb-4 txt-fx slide-up text-uppercase">Blog</h1>
						</div>
					</div>
				</div>

				<!-- Dinamikus, 2-oszlopos blog rács (lapozó eltávolítva) -->
				<div id="dynamic-blog-wrapper" class="row row-cols-2 g-4" data-aos="fade-up"></div>

			</div>
		</div>
	</main>

	<!-- Bootstrap JS -->
  <script>window.subPagePrefix = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/jquery-1.11.0.min.js"></script>
  <script src="../js/plugins.js"></script>
  <script src="../js/script.js"></script>

</body>
</html>
